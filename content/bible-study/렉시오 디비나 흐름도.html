<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>렉시오 디비나 흐름도</title>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Pretendard',sans-serif;
  background:#faf7f1;
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;
  padding:24px;
}
.frame{max-width:600px;width:100%;}
</style>
</head>
<body>
<div class="frame">
<svg viewBox="0 0 600 930" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="6%" r="70%">
      <stop offset="0%" stop-color="#f3e3cc"/>
      <stop offset="50%" stop-color="#faf7f1"/>
      <stop offset="100%" stop-color="#faf7f1"/>
    </radialGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#c8a15a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="600" height="930" fill="url(#bgGlow)"/>

  <!-- Title -->
  <text x="300" y="52" text-anchor="middle" font-family="Pretendard" font-weight="800" font-size="25" fill="#1f2b45">렉시오 디비나</text>
  <text x="300" y="75" text-anchor="middle" font-family="Pretendard" font-weight="600" font-size="12.5" fill="#b8945a" letter-spacing="2">LECTIO DIVINA · 네 걸음</text>

  <!-- vertical connector -->
  <line x1="300" y1="108" x2="300" y2="800" stroke="#e6d3ac" stroke-width="2" stroke-dasharray="1,7"/>

  <!-- STEP 1 -->
  <circle cx="300" cy="138" r="28" fill="#f6e9d8"/>
  <text x="300" y="146" text-anchor="middle" font-family="Pretendard" font-weight="800" font-size="19" fill="#1f2b45">1</text>

  <rect x="60" y="176" width="480" height="112" rx="18" fill="#ffffff" stroke="#eae4d8"/>
  <text x="300" y="208" text-anchor="middle" font-family="Pretendard" font-weight="800" font-size="18" fill="#1f2b45">읽기</text>
  <text x="300" y="226" text-anchor="middle" font-family="Pretendard" font-weight="700" font-size="10.5" fill="#b8945a" letter-spacing="1">LECTIO</text>
  <text x="300" y="251" text-anchor="middle" font-family="Pretendard" font-size="13" fill="#3a4766">본문을 천천히, 소리 내어 읽습니다.</text>
  <text x="300" y="271" text-anchor="middle" font-family="Pretendard" font-size="13" fill="#3a4766">마음에 걸리는 한 단어를 만나면 멈춥니다.</text>

  <line x1="300" y1="288" x2="300" y2="316" stroke="#c8a15a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- STEP 2 -->
  <circle cx="300" cy="346" r="28" fill="#e3ecf5"/>
  <text x="300" y="354" text-anchor="middle" font-family="Pretendard" font-weight="800" font-size="19" fill="#1f2b45">2</text>

  <rect x="60" y="384" width="480" height="112" rx="18" fill="#ffffff" stroke="#eae4d8"/>
  <text x="300" y="416" text-anchor="middle" font-family="Pretendard" font-weight="800" font-size="18" fill="#1f2b45">묵상</text>
  <text x="300" y="434" text-anchor="middle" font-family="Pretendard" font-weight="700" font-size="10.5" fill="#b8945a" letter-spacing="1">MEDITATIO</text>
  <text x="300" y="459" text-anchor="middle" font-family="Pretendard" font-size="13" fill="#3a4766">멈춘 그 말씀을 마음속으로 되새깁니다.</text>
  <text x="300" y="479" text-anchor="middle" font-family="Pretendard" font-size="13">"왜 이 말씀이 지금 나에게 다가올까?"</text>

  <line x1="300" y1="496" x2="300" y2="524" stroke="#c8a15a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- STEP 3 -->
  <circle cx="300" cy="554" r="28" fill="#eee3f2"/>
  <text x="300" y="562" text-anchor="middle" font-family="Pretendard" font-weight="800" font-size="19" fill="#1f2b45">3</text>

  <rect x="60" y="592" width="480" height="112" rx="18" fill="#ffffff" stroke="#eae4d8"/>
  <text x="300" y="624" text-anchor="middle" font-family="Pretendard" font-weight="800" font-size="18" fill="#1f2b45">기도</text>
  <text x="300" y="642" text-anchor="middle" font-family="Pretendard" font-weight="700" font-size="10.5" fill="#b8945a" letter-spacing="1">ORATIO</text>
  <text x="300" y="667" text-anchor="middle" font-family="Pretendard" font-size="13" fill="#3a4766">묵상에서 떠오른 마음을 하나님께 아룁니다.</text>
  <text x="300" y="687" text-anchor="middle" font-family="Pretendard" font-size="13" fill="#3a4766">감사, 회개, 간구 — 솔직한 응답이면 충분합니다.</text>

  <line x1="300" y1="704" x2="300" y2="732" stroke="#c8a15a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- STEP 4 -->
  <circle cx="300" cy="762" r="28" fill="#e2f0e6"/>
  <text x="300" y="770" text-anchor="middle" font-family="Pretendard" font-weight="800" font-size="19" fill="#1f2b45">4</text>

  <rect x="40" y="800" width="520" height="112" rx="18" fill="#1f2b45"/>
  <text x="300" y="832" text-anchor="middle" font-family="Pretendard" font-weight="800" font-size="18" fill="#ffffff">머묾 · 관상</text>
  <text x="300" y="850" text-anchor="middle" font-family="Pretendard" font-weight="700" font-size="10.5" fill="#e6d3ac" letter-spacing="1">CONTEMPLATIO</text>
  <text x="300" y="875" text-anchor="middle" font-family="Pretendard" font-size="13" fill="#dfe4ee">말을 멈추고 하나님 앞에 고요히 머뭅니다.</text>
  <text x="300" y="895" text-anchor="middle" font-family="Pretendard" font-size="13" fill="#dfe4ee">더 이상 애써 생각하지도, 말하지도 않습니다.</text>
</svg>
</div>
</body>
</html>
