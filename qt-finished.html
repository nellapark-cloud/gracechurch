<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>올해 365일 통독을 마쳤습니다</title>

<meta property="og:title" content="올해 365일 통독을 마쳤습니다">
<meta property="og:description" content="365일 성경통독의 마지막 날, 본문을 정리하고 묵상 포인트로 하루를 시작해요.">
<meta property="og:image" content="https://sejonggrace.com/content/bible-by-book/images/qt-thumb-v2.png">
<meta property="og:type" content="article">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">

<style>
  :root{
    --bg:#fbfaf8;
    --ink:#2b2a33;
    --ink-soft:#5c5a68;
    --pink:#ffd6e8;
    --blue:#d6e8ff;
    --mint:#d3f5e8;
    --violet:#e6d9ff;
    --purple:#8b5cf6;
    --purple-deep:#6d28d9;
    --pink-deep:#ec4899;
    --card-bg:rgba(255,255,255,0.55);
    --card-border:rgba(255,255,255,0.8);
    --shadow: 0 8px 32px rgba(80,60,120,0.08);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    font-family:'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    background:var(--bg);
    color:var(--ink);
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  .bg-orbs{ position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none; }
  .orb{ position:absolute; border-radius:50%; filter:blur(60px); opacity:0.55; }
  .orb-pink{ width:420px; height:420px; background:var(--pink); top:-120px; left:-100px; }
  .orb-blue{ width:380px; height:380px; background:var(--blue); top:200px; right:-140px; }
  .orb-mint{ width:340px; height:340px; background:var(--mint); bottom:120px; left:-120px; }
  .orb-violet{ width:400px; height:400px; background:var(--violet); bottom:-160px; right:-80px; }

  .nav{
    position:sticky; top:0; z-index:50;
    display:flex; justify-content:center; gap:8px;
    padding:14px 16px;
    background:rgba(251,250,248,0.75);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid rgba(0,0,0,0.05);
    flex-wrap:wrap;
  }
  .nav a{
    font-size:13px; font-weight:600; color:var(--ink-soft);
    text-decoration:none; padding:7px 14px; border-radius:999px;
    background:rgba(255,255,255,0.6);
    border:1px solid rgba(0,0,0,0.05);
    transition:all .2s ease;
  }
  .nav a:hover{
    background:linear-gradient(135deg, var(--pink-deep), var(--purple));
    color:#fff; border-color:transparent;
  }

  .wrap{ max-width:680px; margin:0 auto; padding:0 20px 70px; }

  .hero{ text-align:center; padding:52px 0 8px; }
  .eyebrow{
    font-size:13px; font-weight:700; letter-spacing:0.02em;
    color:var(--purple-deep); margin-bottom:18px;
  }
  .eyebrow .mark{ color:var(--pink-deep); margin-right:4px; }
  .hero h1{
    font-size:clamp(26px,6vw,36px);
    font-weight:800; line-height:1.35; margin:0 0 14px; color:var(--ink);
  }
  .hero h1 .book-line{ display:block; }
  .hero p{ font-size:15px; color:var(--ink-soft); margin:0; }

  .section{ margin-top:38px; }

  .glass-card{
    background:var(--card-bg);
    backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    border:1px solid var(--card-border);
    border-radius:22px;
    padding:28px 26px;
    box-shadow:var(--shadow);
    margin-bottom:20px;
    scroll-margin-top:70px;
  }
  .card-num{
    font-size:32px; font-weight:800;
    background:linear-gradient(120deg, var(--purple-deep), var(--pink-deep));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    display:block; margin-bottom:6px;
  }
  .card-label{
    font-size:14px; font-weight:700; color:var(--ink-soft); margin-bottom:10px;
  }
  .glass-card h2{ font-size:19px; font-weight:800; margin:0 0 12px; color:var(--ink); }
  .glass-card p{ margin:0 0 12px; font-size:15px; color:var(--ink); }
  .glass-card p:last-child{ margin-bottom:0; }

  .med-section{ scroll-margin-top:70px; }
  .med-intro{ font-size:14.5px; color:var(--ink-soft); margin-bottom:18px; }
  .med-block{ margin-bottom:18px; }
  .med-block:last-child{ margin-bottom:0; }
  .med-block .tag{
    display:inline-block; font-size:13px; font-weight:700;
    color:var(--purple-deep);
    background:rgba(139,92,246,0.08);
    border-radius:999px; padding:4px 12px; margin-bottom:10px;
  }
  .med-block p{ margin:0; font-size:15px; color:var(--ink); }

  footer{
    text-align:center; padding:34px 20px 20px;
    font-size:13px; color:var(--ink-soft);
  }
  .fin-actions{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:18px; }
  .fin-actions a{ display:inline-block; padding:11px 20px; border-radius:999px; font-size:14px; font-weight:700; text-decoration:none; background:rgba(255,255,255,.8); color:var(--ink); border:1px solid rgba(0,0,0,.06); }
  .fin-actions a.pri{ background:linear-gradient(135deg,#519CEC,#0360C2); color:#fff; border:0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="eyebrow"><span class="mark">✦</span>365일 성경통독</div>
    <h1><span class="book-line">올해 통독을</span><span class="book-line">모두 마쳤습니다</span></h1>
    <p>창세기부터 요한계시록까지, 한 해 동안 함께 걸어온 말씀의 길이에요.</p>
  </div>
  <div class="section">
    <div class="glass-card">
      <h2>수고 많으셨어요</h2>
      <p>매일 아침 7시, 말씀 앞에 앉았던 그 자리가 하나님 앞에서 귀한 예배였습니다.</p>
      <p>새해 <b>1월 1일부터 1일차(창세기 1-2장, 시편 1편)로 다시 시작</b>합니다. 그때까지는 올해 읽은 말씀 가운데 마음에 남은 본문을 천천히 다시 묵상해 보세요.</p>
      <p>"주의 말씀은 내 발에 등이요 내 길에 빛이니이다" (시 119:105)</p>
      <div class="fin-actions">
        <a class="pri" href="/content/bible-by-book/qt/365.html">365일차 다시 보기</a>
        <a href="/content/bible-by-book/qt/1.html">1일차 미리 보기</a>
        <a href="/">홈으로</a>
      </div>
    </div>
  </div>
</div>
<footer>기독교한국침례회 은혜교회</footer>
</body>
</html>
