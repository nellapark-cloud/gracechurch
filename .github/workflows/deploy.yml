name: Build and Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 검색용 사이트맵에 자료별 수정 날짜를 넣으려고 전체 기록을 받아옴
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node build-list.js
      # 네이버·다음·구글 검색 최적화 (사이트맵·RSS·robots.txt, 첫 화면 목록 미리 채우기)
      - run: node build-seo.js
      # 링크 미리보기(OG) 이미지가 없는 페이지에 기본 이미지를 자동으로 넣음
      - run: node add-default-og.js
      # 모든 콘텐츠 페이지에 공통 "목차" 버튼을 넣고, 다른 떠 있는 버튼은 숨김
      - run: node add-toc-button.js
      # 주보·목장 나눔지는 개인 정보가 많아 공개 사이트에 올리지 않음
      - run: rm -rf content/bulletin content/mokjang-sharing
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
